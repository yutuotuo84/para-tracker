<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - PARA Tracker</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #ecfdf5);
        }
        .login-card {
            background: var(--card);
            border-radius: 16px;
            padding: 3rem 2.5rem;
            width: 380px;
            max-width: 90%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1);
            text-align: center;
        }
        .login-card h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .login-card p {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        .login-card input {
            margin-bottom: 1rem;
            text-align: center;
            font-size: 1rem;
        }
        .login-card .error {
            color: #ef4444;
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
            min-height: 1.5rem;
        }
    </style>
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <h1>📋 PARA Tracker</h1>
        <p>请输入密码以继续</p>
        <div class="error" id="error"></div>
        <input type="password" id="password" placeholder="输入密码"
               @keydown.enter="handleLogin()">
        <button class="btn btn-primary" id="loginBtn" style="width:100%;" onclick="handleLogin()">
            登录
        </button>
    </div>
</div>
<script>
    async function handleLogin() {
        const pw = document.getElementById('password').value;
        const btn = document.getElementById('loginBtn');
        const err = document.getElementById('error');
        if (!pw.trim()) { err.textContent = '请输入密码'; return; }
        btn.disabled = true;
        btn.textContent = '登录中...';
        try {
            const resp = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: pw }),
            });
            if (resp.ok) {
                window.location.href = '/';
            } else {
                const data = await resp.json();
                err.textContent = data.detail || '密码错误';
            }
        } catch (e) {
            err.textContent = '请求失败: ' + e.message;
        } finally {
            btn.disabled = false;
            btn.textContent = '登录';
        }
    }
    document.getElementById('password').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') handleLogin();
    });
</script>
</body>
</html>
