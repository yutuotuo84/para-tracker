<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - PARA Tracker</title>
    <link rel="stylesheet" href="/static/styles.css">
    <style>
        .login-page {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #ecfdf5);
        }
        .login-card {
            background: var(--card);
            border-radius: 16px;
            padding: 3rem 2.5rem;
            width: 380px;
            max-width: 90%;
            box-shadow: 0 25px 50px rgba(0,0,0,0.1);
            text-align: center;
        }
        .login-card h1 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .login-card .subtitle {
            color: var(--text-secondary);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }
        .login-card input {
            margin-bottom: 1rem;
            font-size: 1rem;
        }
        .login-card .error {
            color: #ef4444;
            font-size: 0.85rem;
            margin-bottom: 0.75rem;
            min-height: 1.5rem;
        }
        .login-card .switch-link {
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .login-card .switch-link a {
            color: var(--para-p);
            cursor: pointer;
            text-decoration: none;
        }
        .login-card .switch-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="login-page">
    <div class="login-card">
        <h1>📋 PARA Tracker</h1>
        <p class="subtitle" id="subtitle">登录到你的账户</p>
        <div class="error" id="error"></div>

        <input type="text" id="username" placeholder="用户名" autocomplete="username">
        <input type="password" id="password" placeholder="密码" autocomplete="current-password">

        <button class="btn btn-primary" id="submitBtn" style="width:100%;" onclick="handleSubmit()">
            登录
        </button>

        <div class="switch-link">
            <span id="switchText">还没有账号？</span>
            <a id="switchLink" onclick="toggleMode()">注册</a>
        </div>
    </div>
</div>
<script>
    let isRegister = false;

    function toggleMode() {
        isRegister = !isRegister;
        document.getElementById('subtitle').textContent = isRegister ? '创建新账户' : '登录到你的账户';
        document.getElementById('submitBtn').textContent = isRegister ? '注册' : '登录';
        document.getElementById('switchText').textContent = isRegister ? '已有账号？' : '还没有账号？';
        document.getElementById('switchLink').textContent = isRegister ? '登录' : '注册';
        document.getElementById('error').textContent = '';
    }

    async function handleSubmit() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const btn = document.getElementById('submitBtn');
        const err = document.getElementById('error');

        if (!username) { err.textContent = '请输入用户名'; return; }
        if (!password) { err.textContent = '请输入密码'; return; }

        btn.disabled = true;
        btn.textContent = '处理中...';

        try {
            const endpoint = isRegister ? '/api/auth/register' : '/api/auth/login';
            const resp = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password }),
            });

            if (resp.ok) {
                if (isRegister) {
                    // 注册成功后自动切换到登录模式并填入用户名
                    isRegister = false;
                    toggleMode();
                    document.getElementById('password').value = '';
                    err.textContent = '';
                    err.style.color = '#10b981';
                    err.textContent = '注册成功，请登录';
                    document.getElementById('password').focus();
                } else {
                    window.location.href = '/';
                }
            } else {
                const data = await resp.json();
                err.style.color = '#ef4444';
                err.textContent = data.detail || '操作失败';
            }
        } catch (e) {
            err.style.color = '#ef4444';
            err.textContent = '请求失败: ' + e.message;
        } finally {
            btn.disabled = false;
            btn.textContent = isRegister ? '注册' : '登录';
        }
    }

    document.getElementById('password').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') handleSubmit();
    });
    document.getElementById('username').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') document.getElementById('password').focus();
    });
</script>
</body>
</html>
